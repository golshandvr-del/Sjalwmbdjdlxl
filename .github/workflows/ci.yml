# Project Nexus - Continuous Integration.
#
# Four headless gates (no GPU needed), identical to AGENTS.md section 4:
#   G1 code-policy lint, G2 unit/integration tests, G3 scene smoke, G4 game smoke.
# The editor import is run twice first: the first import on a fresh checkout
# may log font/theme errors (KI-5) and generates the global class cache.
#
# CODE LANGUAGE POLICY: English-only identifiers/comments.
name: CI

on:
  push:
    branches: [ main, "oh/**", "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  gates:
    name: G1-G4 headless gates (Godot 4.7.2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot (headless)
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm -f godot.zip
          godot --version

      - name: G0 import project (twice)
        run: |
          godot --headless --editor --quit --path . || true
          godot --headless --editor --quit --path . || true

      - name: G1 CODE_POLICY lint
        run: godot --headless --path . --script res://tools/check_code_policy.gd

      - name: G2 tests
        run: |
          godot --headless --path . --script res://tests/test_runner.gd 2>&1 | tee /tmp/test.log
          grep -E "^Total: [0-9]+ +Passed: [0-9]+ +Failed: 0" /tmp/test.log

      - name: G3 scene smoke
        run: |
          godot --headless --path . res://tools/scene_smoke.tscn 2>&1 | tee /tmp/scene.log
          grep -q "SCENE_SMOKE_DONE failures=0" /tmp/scene.log

      - name: G4 game smoke
        run: |
          godot --headless --path . res://tools/game_smoke.tscn 2>&1 | tee /tmp/game.log
          grep -q "GAME_SMOKE_DONE failures=0" /tmp/game.log

      - name: G6 exported pack boots (export filter regression, KI-10)
        run: |
          godot --headless --path . --export-pack "Android" /tmp/nexus.pck 2>&1 | tail -3
          test -s /tmp/nexus.pck
          mkdir -p /tmp/packrun
          (cd /tmp/packrun && godot --headless --main-pack /tmp/nexus.pck --quit-after 300 2>&1 | tee /tmp/pack.log)
          if grep -E "SCRIPT ERROR|ERROR: Failed to load" /tmp/pack.log; then exit 1; fi

      - name: G5 Godot must not dirty the tree (uid/import policy, DEC-007)
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
